# Publica o site sempre que o computador do Matheus envia preços novos (git push).
# Não tem nenhuma senha ou chave aqui: os preços são consultados no PC dele (robo/rodar_local.py).
name: publicar-site

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: publicar
  cancel-in-progress: true

env:
  TZ: America/Sao_Paulo
  PYTHONIOENCODING: utf-8

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Testes (se falhar, nada é publicado)
        run: python testes/teste.py
      - name: Gera o site
        run: python site/build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist
      - id: deploy
        uses: actions/deploy-pages@v4
